version: "3.9"

services:
  # ─── MySQL Database ────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: smarterp_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stock_management
      MYSQL_USER: smarterp
      MYSQL_PASSWORD: smarterp_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - smarterp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Laravel API Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smarterp_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "SmartERP Pro"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost
      FRONTEND_URL: http://localhost
      SANCTUM_STATEFUL_DOMAINS: localhost
      SESSION_DOMAIN: localhost
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: stock_management
      DB_USERNAME: smarterp
      DB_PASSWORD: smarterp_password
      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
    volumes:
      - backend_storage:/var/www/html/storage
    networks:
      - smarterp_network
    expose:
      - "9000"

  # ─── Vue.js 3 Frontend ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smarterp_frontend
    restart: unless-stopped
    networks:
      - smarterp_network
    expose:
      - "80"

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: smarterp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_storage:/var/www/html/storage:ro
    networks:
      - smarterp_network

networks:
  smarterp_network:
    driver: bridge

volumes:
  db_data:
  backend_storage:
